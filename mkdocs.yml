site_name: ruMorph
site_url: https://sergeyshk.github.io/ruMorph/
site_description: "Быстрый морфологический анализатор русского языка на Rust с API для Python"
repo_url: https://github.com/SergeyShk/ruMorph

nav:
    - Главная:
      - О проекте: index.md
      - Установка: installation.md
      - Авторы: authors.md
    - Разбор словоформ: analysis.md

theme:
  name: material
  language: ru
  palette:
    primary: blue
    accent: blue
  font:
    text: Source Sans Pro
  features:
    - navigation.tabs

plugins:
  - search:
      lang:
        - ru
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: "Fast Russian morphological analyzer written in Rust with a Python API"
          nav_translations:
            Главная: Home
            О проекте: About
            Установка: Installation
            Авторы: Authors
            Разбор словоформ: Word analysis

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SergeyShk
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kouki91/

extra_css:
  - css/extra.css

markdown_extensions:
  - toc:
      permalink: True
  - attr_list
  - admonition
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
