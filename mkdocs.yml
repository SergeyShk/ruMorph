site_name: ruMorph
site_url: https://sergeyshk.github.io/ruMorph/
site_description: "Быстрый морфологический анализатор русского языка на Rust с API для Python"
repo_url: https://github.com/SergeyShk/ruMorph

nav:
    - Главная:
      - О проекте: index.md
      - Установка: installation.md
      - Переход с pymorphy: migration.md
      - Сравнение: performance.md
      - Исключения: exceptions.md
      - Авторы: authors.md
    - Анализатор: analyzer.md
    - Разбор словоформы: analysis.md
    - Словоизменение: inflection.md
    - Команда rumorph: cli.md
    - spaCy: spacy.md

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Темная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  font:
    text: Source Sans Pro
    code: Source Code Pro
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

validation:
  anchors: warn

plugins:
  - search:
      lang:
        - ru
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: "Fast Russian morphological analyzer written in Rust with a Python API"
          nav_translations:
            Главная: Home
            О проекте: About
            Установка: Installation
            Переход с pymorphy: Migrating from pymorphy
            Сравнение: Comparison
            Исключения: Exceptions
            Авторы: Authors
            Анализатор: Analyzer
            Разбор словоформы: Word analysis
            Словоизменение: Inflection
            Команда rumorph: The rumorph command

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SergeyShk
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/kouki91/

extra_css:
  - css/extra.css

markdown_extensions:
  - toc:
      permalink: True
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
