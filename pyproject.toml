[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "rumorph"
version = "0.4.0.dev6"
description = "Fast Russian morphological analyzer written in Rust with a Python API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE.txt", "LICENSE-DICTIONARY.txt"]
authors = [{ name = "Шкарин Сергей", email = "kouki.sergey@gmail.com" }]
maintainers = [{ name = "Шкарин Сергей", email = "kouki.sergey@gmail.com" }]
keywords = [
    "morphology",
    "morphological analysis",
    "lemmatization",
    "pymorphy",
    "OpenCorpora",
    "NLP",
    "russian",
    "spaCy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
    "Natural Language :: Russian",
]
dependencies = []

[project.optional-dependencies]
spacy = ["spacy>=3.8,<4"]

[project.scripts]
rumorph = "rumorph.__main__:main"

[project.entry-points.spacy_factories]
rumorph = "rumorph.spacy:create_component"

[project.urls]
Homepage = "https://github.com/SergeyShk/ruMorph"
Repository = "https://github.com/SergeyShk/ruMorph"
Documentation = "https://sergeyshk.github.io/ruMorph/"
Issues = "https://github.com/SergeyShk/ruMorph/issues"

[tool.maturin]
manifest-path = "crates/rumorph-py/Cargo.toml"
module-name = "rumorph._rumorph"
python-source = "python"
include = [{ path = "python/rumorph/data/ru.dict", format = ["sdist", "wheel"] }]
sdist-generator = "git"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[dependency-groups]
dictionary = ["pymorphy3==2.0.6", "pymorphy3-dicts-ru==2.4.417150.4580142"]
test = ["pytest>=8.3", "pytest-cov>=6.0", { include-group = "dictionary" }]
# Нет колес для 3.14t: CI ставит группу на остальных версиях
spacy = ["spacy>=3.8,<4"]
lint = ["mypy>=1.14", "pre-commit>=4.0", "ruff>=0.9"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.0",
]
dev = [
    { include-group = "test" },
    { include-group = "spacy" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["python", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["rumorph"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N801", "N802"]

[tool.mypy]
python_version = "3.11"
files = ["python/rumorph"]
pretty = true
show_traceback = true
color_output = true
allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-v --strict-markers --strict-config --doctest-modules --doctest-ignore-import-errors"
testpaths = ["tests", "python/rumorph"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["rumorph"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
