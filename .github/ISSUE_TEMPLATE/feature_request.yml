name: Предложение
description: Новая возможность анализатора или API
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
      description: Что вы хотите сделать с текстами и почему текущих возможностей не хватает
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
      description: Как это могло бы выглядеть - функция, параметр и пример результата
  - type: checkboxes
    id: contribution
    attributes:
      label: Участие
      options:
        - label: Готов(а) сделать пул-реквест
