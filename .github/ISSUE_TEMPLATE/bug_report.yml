name: Ошибка
description: Неверный разбор, исключение или падение
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Что происходит
      description: Что вы ожидали и что получили
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Словоформы или минимальный код, на которых проявляется ошибка, и полный traceback, если он есть
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия ruMorph
      description: "`python -c \"import rumorph; print(rumorph.__version__)\"`"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python и ОС
      placeholder: "Python 3.12, Ubuntu 24.04"
    validations:
      required: true
