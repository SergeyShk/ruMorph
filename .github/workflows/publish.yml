name: publish

# Тег: словарь, колеса и исходники собираются один раз, проверяются на всех платформах
# и публикуются на TestPyPI; версия без .devN затем публикуется на PyPI - те же файлы.
# PR с изменением публикации или сборки - та же цепочка без публикации

on:
  push:
    tags:
      - "*"
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "scripts/smoke.py"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Check version matches tag
        if: github.event_name == 'push'
        run: |
          version="$(uv version --short)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Version in pyproject.toml ($version) does not match the tag ($GITHUB_REF_NAME)"
            exit 1
          fi

  dictionary:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
          python-version: "3.13"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dictionary --no-install-project
      - name: Build dictionary
        run: |
          uv run --no-sync python scripts/export_pymorphy.py build/opencorpora
          cargo run --release --locked -p rumorph-build -- build/opencorpora python/rumorph/data/ru.dict
          sha256sum python/rumorph/data/ru.dict
      - name: Upload dictionary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dictionary
          path: python/rumorph/data/ru.dict
          if-no-files-found: error

  wheels:
    name: wheels (${{ matrix.os }}, ${{ matrix.target }})
    needs: dictionary
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          # Оба колеса macOS - в одном задании: раннеров arm64 часто не хватает
          - os: macos-latest
            target: x86_64 aarch64
          - os: windows-latest
            target: x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download dictionary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictionary
          path: python/rumorph/data
      - name: Build wheel
        if: runner.os != 'macOS'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist
          manylinux: auto
      - name: Build wheel (macOS x86_64)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: x86_64
          args: --release --locked --compatibility pypi --out dist
      - name: Build wheel (macOS aarch64)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: aarch64
          args: --release --locked --compatibility pypi --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  sdist:
    needs: dictionary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download dictionary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dictionary
          path: python/rumorph/data
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
          python-version: ${{ matrix.python-version }}
      - name: Smoke test
        run: >-
          uv run --isolated --no-project --no-index --no-build --find-links dist --with rumorph
          python scripts/smoke.py ${{ github.event_name == 'push' && github.ref_name || '' }}
        shell: bash

  smoke-sdist:
    needs: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
          python-version: "3.13"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Так собирают из исходников conda-forge и дистрибутивы: с Cargo.lock из архива
      - name: Build wheel from sdist
        run: |
          mkdir build
          tar xzf dist/*.tar.gz -C build
          cd build/*/
          uvx maturin@1.15.0 build --release --locked --out ../../wheel
      - name: Smoke test
        run: >-
          uv run --isolated --no-project --no-index --no-build --find-links wheel --with rumorph
          python scripts/smoke.py ${{ github.event_name == 'push' && github.ref_name || '' }}

  # Проверка - отдельно от заданий с правом публикации
  check-distribution:
    needs: [smoke, smoke-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
          python-version: "3.13"
      - name: Check distribution
        run: |
          uvx twine@7.0.0 check --strict dist/*
          for file in dist/*.whl; do unzip -l "$file" rumorph/data/ru.dict > /dev/null || { echo "No dictionary in $file"; exit 1; }; done
          tar tzf dist/*.tar.gz | grep -q '/python/rumorph/data/ru.dict$' || { echo "No dictionary in the sdist"; exit 1; }
          ls -l dist
          sha256sum dist/*

  testpypi:
    if: github.event_name == 'push'
    needs: check-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Publish distribution
        run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always dist/*

  pypi:
    # Версии 0.1.0.devN - только на TestPyPI
    if: github.event_name == 'push' && !contains(github.ref_name, '.dev')
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/rumorph/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Publish distribution
        run: uv publish --trusted-publishing always dist/*
