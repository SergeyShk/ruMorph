name: build

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group lint --no-install-project
      - name: Ruff
        run: |
          uv run --no-sync ruff check python scripts tests
          uv run --no-sync ruff format python scripts tests --check
      - name: Ruff format of the Python in Markdown
        run: git ls-files -z '*.md' | xargs -0 uv run --no-sync ruff format --check
      - name: Mypy
        run: uv run --no-sync mypy
      - name: Rustfmt
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.14t"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install dependencies
        # У spaCy нет колес для 3.14t: там тесты компонента пропускаются
        run: uv sync --locked --no-default-groups --group test ${{ matrix.python-version != '3.14t' && '--group spacy' || '' }}
      - name: Cache OpenCorpora
        # Снимки словаря и корпуса OpenCorpora (Wayback Machine, копия на Hugging Face) и Викисловаря:
        # скачиваются один раз на версию скрипта
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/opencorpora/raw
          key: opencorpora-${{ hashFiles('scripts/export_opencorpora.py') }}
          # На Windows хэш скрипта с CRLF другой: подходит любой прежний кэш, download сверяет SHA-256
          restore-keys: opencorpora-
          enableCrossOsArchive: true
      - name: Cache UD
        # Обучающие части трибанков UD_Russian-Taiga и GSD - с GitHub: скачиваются один раз на версию скрипта,
        # download сверяет SHA-256 и файлов кэша
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ud/raw
          key: ud-${{ hashFiles('scripts/export_ud.py') }}
          restore-keys: ud-
          enableCrossOsArchive: true
      - name: Build dictionary
        shell: bash
        run: |
          uv run --no-sync python scripts/export_opencorpora.py build/opencorpora
          uv run --no-sync python scripts/export_ud.py build/ud
          cargo run --release --locked -p rumorph-build -- build/opencorpora build/ud python/rumorph/data/ru.dict data/ru-context.bin
          uv run --no-sync python -c "import hashlib; print(hashlib.sha256(open('python/rumorph/data/ru.dict', 'rb').read()).hexdigest())"
      - name: Check dictionary size
        # Словарь едет на crates.io в архиве крейта rumorph-dict-ru, а там предел - 10 МиБ: PR, меняющий
        # только скрипты словаря, проверяет его здесь, а не на релизном теге
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          size="$(gzip -9 -c python/rumorph/data/ru.dict | wc -c)"
          echo "ru.dict compressed: $size bytes"
          [ "$size" -lt 10420224 ] || { echo "The compressed dictionary does not fit the crates.io limit of 10 MiB"; exit 1; }
      - name: Run tests
        run: uv run --no-sync pytest --cov rumorph ${{ matrix.python-version == '3.14t' && '--cov-fail-under=0' || '' }}
      - name: Run Rust tests
        run: cargo test -p rumorph -p rumorph-build -p rumorph-dict-ru --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check
        run: cargo check --workspace --all-targets --locked

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked --only-group docs
      - name: Build docs
        run: uv run --no-sync mkdocs build --strict
