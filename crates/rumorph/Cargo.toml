[package]
name = "rumorph"
description = "Fast Russian morphological analyzer: lemmas, Universal Dependencies features and inflection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://sergeyshk.github.io/ruMorph/"
readme = "README.md"
keywords = ["morphology", "russian", "lemmatization", "nlp", "opencorpora"]
categories = ["text-processing"]

[features]
default = ["bundled"]
# Словарь ruMorph из крейта rumorph-dict-ru: Dictionary::bundled
bundled = ["dep:rumorph-dict-ru"]
# Разбор документа сегментатора anySeg: Dictionary::annotate
anyseg = ["dep:anyseg"]
# Сборка своих словарей: Builder и GuessIndex
build = []
# Команда rumorph: cargo install rumorph --features cli
cli = ["anyseg"]

[[bin]]
name = "rumorph"
required-features = ["cli"]

[dependencies]
anyseg = { version = "0.2.0", optional = true, default-features = false, features = ["ru"] }
bytemuck = "1.25.2"
crc32fast = "1.5.3"
fst = "0.4.7"
memmap2 = "0.9.11"
rumorph-dict-ru = { version = "=0.5.0-dev.3", path = "../rumorph-dict-ru", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
