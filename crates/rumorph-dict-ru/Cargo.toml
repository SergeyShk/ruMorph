[package]
name = "rumorph-dict-ru"
description = "Russian dictionary for the ruMorph morphological analyzer, built from OpenCorpora and Wiktionary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "CC-BY-SA-4.0"
authors.workspace = true
repository.workspace = true
homepage = "https://sergeyshk.github.io/ruMorph/"
readme = "README.md"
keywords = ["russian", "dictionary", "morphology", "opencorpora", "nlp"]
categories = ["text-processing"]
# Файл словаря не хранится в git: перед публикацией CI кладет сюда сжатый ru.dict.zst
include = ["build.rs", "src/**", "README.md", "LICENSE-DICTIONARY.txt", "ru.dict.zst"]

[build-dependencies]
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
